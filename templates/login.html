<!DOCTYPE html>
<html>
<head>

  <title>Admin Login</title>

  <style>

    body{
      background:#111;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    form{
      width:350px;
      background:#1a1a1a;
      padding:30px;
      border-radius:12px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      background:#222;
      border:none;
      color:white;
    }

    button{
      width:100%;
      padding:12px;
      background:gold;
      border:none;
      font-weight:bold;
      cursor:pointer;
    }

  </style>

</head>
<body>

<form method="POST">

  <h2>Admin Login</h2>

  <input
    type="text"
    name="username"
    placeholder="Username"
    required
  >

  <input
    type="password"
    name="password"
    placeholder="Password"
    required
  >

  <button type="submit">
    Login
  </button>

</form>

</body>
</html>
